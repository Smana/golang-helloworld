version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - unconvert
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - wrapperFunc
        - dupImport
        - ifElseChain
        - paramTypeCombine
        - hugeParam
        - exitAfterDefer
      enabled-tags:
        - performance
        - style
        - experimental
    gocyclo:
      min-complexity: 10
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - gocyclo
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - image-gallery
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
